<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fanchan Sentinel · 审核客户端</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --line:#242832;
  --fg:#e6e8ee; --dim:#98a0b0; --ok:#3ecf8e; --bad:#ff6b6b; --acc:#7aa2f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{padding:18px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:rgba(15,17,21,.94);backdrop-filter:blur(8px);z-index:9}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.3px}
.sub{margin-top:3px;font-size:12px;color:var(--dim)}
main{padding:16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
input,select,textarea{width:100%;background:#0d0f13;border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{min-height:110px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--acc);color:#0b0d12;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button:disabled{opacity:.45}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{width:auto;flex:1;min-width:120px;padding:10px;font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.r{background:rgba(255,107,107,.16);color:var(--bad)}
.pill.s{background:rgba(62,207,142,.16);color:var(--ok)}
.res{margin-top:4px}
.res .lbl{font-size:30px;font-weight:700;letter-spacing:-.5px}
.ev{margin-top:10px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:9px}
.ev code{background:#0d0f13;padding:1px 5px;border-radius:4px;font-size:11px;color:var(--acc)}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #0b0d12;border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{color:var(--ok);font-size:13px}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Fanchan Sentinel</h1>
  <div class="sub">多模态内容审核客户端 · 判定在服务端本地推理</div>
</header>
<main>

<div class="card">
  <label>服务地址</label>
  <input id="base" placeholder="https://your-tunnel.loca.lt">
  <label>访问密钥（服务端设了 SENTINEL_API_KEY 才需填）</label>
  <input id="key" type="password" placeholder="可留空">
  <div class="row" style="margin-top:12px">
    <button class="ghost" id="test">测试连接</button>
    <button class="ghost" id="save">保存设置</button>
  </div>
  <div class="hint" id="conn">—</div>
</div>

<div class="card">
  <label>文本审核</label>
  <textarea id="text" placeholder="粘贴待审核文本…"></textarea>
  <div style="margin-top:11px"><button id="goText">提交文本审核</button></div>
</div>

<div class="card">
  <label>媒体审核（图片 / 音频 / 视频）</label>
  <input type="file" id="file" accept="image/*,audio/*,video/*">
  <div class="hint" id="fname">未选择文件</div>
  <div style="margin-top:11px"><button id="goMedia">提交媒体审核</button></div>
</div>

<div class="card res" id="res" style="display:none">
  <label>判定结果</label>
  <div class="lbl" id="rlbl">—</div>
  <div id="rmeta" class="hint"></div>
  <div class="ev" id="rev"></div>
</div>

</main>
<script>
const $=id=>document.getElementById(id);
const LS='fanchan.settings.v1';
let settings={base:'',key:''};
try{settings=Object.assign(settings,JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){}
$('base').value=settings.base||'';
$('key').value=settings.key||'';

function save(){settings.base=$('base').value.trim();settings.key=$('key').value.trim();
  localStorage.setItem(LS,JSON.stringify(settings));}

$('save').onclick=()=>{save();$('conn').innerHTML='<span class="ok">已保存到本机</span>';};
$('test').onclick=async()=>{
  save();$('conn').innerHTML='<span class="spin"></span>连接中…';
  const b=settings.base.replace(/\/+$/,'');
  if(!b){$('conn').innerHTML='<span class="err">请先填服务地址</span>';return;}
  try{
    const t0=Date.now();
    const r=await fetch(b+'/ping',{method:'GET'});
    const j=await r.json();
    $('conn').innerHTML=r.ok?`<span class="ok">连接正常</span> · ${Date.now()-t0}ms · ${j.ts?new Date(j.ts*1000).toLocaleTimeString():''}`
      :`<span class="err">HTTP ${r.status}</span>`;
  }catch(e){$('conn').innerHTML='<span class="err">连接失败：'+e.message+'</span>';}
};

$('file').onchange=e=>{
  const f=e.target.files[0];
  $('fname').textContent=f?`${f.name} · ${(f.size/1048576).toFixed(2)}MB`:'未选择文件';
};

function modalityOf(f){
  const t=(f.type||'').toLowerCase();
  if(t.startsWith('image'))return 'image';
  if(t.startsWith('audio'))return 'audio';
  if(t.startsWith('video'))return 'video';
  return 'text';
}
function toB64(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}

function showResult(data){
  $('res').style.display='block';
  const risky=data.label===1;
  $('rlbl').innerHTML=risky?'<span class="pill r">有风险 · 应拒答</span>':'<span class="pill s">无风险 · 可放行</span>';
  const au=data.audit||{};
  $('rmeta').textContent=`模态 ${data.modality||'-'} · ${au.latency_ms??'-'} ms · ${au.ts||''}`;
  const ev=(data.evidence||[]).map(e=>{
    const st=e.stage||'';const stat=e.status||'';
    const why=(e.reasons||[]).join('、');
    const err=e.error?(' · '+String(e.error).slice(0,90)):'';
    return `<div>· <code>${st}</code> ${stat}${why?' · '+why:''}${err}</div>`;
  }).join('');
  $('rev').innerHTML=ev||'<div>（无 evidence）</div>';
}

async function submit(body,btn){
  save();
  const b=settings.base.replace(/\/+$/,'');
  if(!b){alert('请先填服务地址');return;}
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span>审核中…';
  $('res').style.display='block';$('rlbl').innerHTML='<span class="spin"></span>处理中…';$('rev').innerHTML='';
  try{
    const h={'Content-Type':'application/json'};
    if(settings.key)h['X-Sentinel-Key']=settings.key;
    const r=await fetch(b+'/review',{method:'POST',headers:h,body:JSON.stringify(body)});
    if(!r.ok){
      let d='';try{d=(await r.json()).detail||'';}catch(e){d=await r.text();}
      $('rlbl').innerHTML=`<span class="err">失败 HTTP ${r.status}</span>`;
      $('rev').innerHTML=`<div>${String(d).slice(0,300)}</div>`;return;
    }
    showResult(await r.json());
  }catch(e){
    $('rlbl').innerHTML='<span class="err">请求失败</span>';
    $('rev').innerHTML=`<div>${e.message}</div>`;
  }finally{btn.disabled=false;btn.innerHTML=old;}
}

$('goText').onclick=()=>{
  const t=$('text').value.trim();
  if(!t){alert('请输入文本');return;}
  submit({filename:'input.txt',modality:'text',text:t},$('goText'));
};

$('goMedia').onclick=async()=>{
  const f=$('file').files[0];
  if(!f){alert('请选择文件');return;}
  const btn=$('goMedia');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>读取中…';
  try{
    const b64=await toB64(f);
    btn.disabled=false;btn.innerHTML='提交媒体审核';
    submit({filename:f.name,modality:modalityOf(f),content_base64:b64},$('goMedia'));
  }catch(e){btn.disabled=false;btn.innerHTML='提交媒体审核';alert('读取失败：'+e.message);}
};
</script>
</body>
</html>
