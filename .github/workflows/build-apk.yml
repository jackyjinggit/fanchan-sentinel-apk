name: build-apk

# 🔴 2026-10-28：云端构建 APK（GitHub runner 自带 Android SDK，不装额外 action）
# 触发：push 到 main（tag 时额外发 Release）→ 产物 APK 可直接下载安装。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 🔴 必须 >=22：Capacitor CLI 报 "requires NodeJS >=22.0.0" 直接退出
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔴 第一版用 android-actions/setup-android@v3 → 失败（该 action 的许可处理
      #    在当前 runner 上不稳定）。GitHub 的 ubuntu runner **本身就预装了
      #    Android SDK**（ANDROID_HOME 已设），只要接受许可 + 装齐组件即可。
      - name: Accept Android licenses and install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME" || true
          # 🔴 2026-10-28 10:45 实测：Capacitor 认 **ANDROID_SDK_ROOT**，
          #    runner 默认只设 ANDROID_HOME → "Could not find the android platform"。
          #    两个都导出。
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -20
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create Android project
        run: |
          # 🔴 第四版真因（拉日志确认，不再猜）：
          #   ① `npx cap add android --no-interactive` → "unknown option" 直接退出
          #      → 去掉该 flag（cap add 本身非交互）
          #   ② "Could not find the android platform" → Capacitor 认 ANDROID_SDK_ROOT
          #      （runner 只设 ANDROID_HOME）→ 在本 step 重新导出（env 作用域独立）
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          cat > package.json <<'PKG'
          { "name": "fanchan-sentinel-apk", "version": "0.1.0", "private": true }
          PKG
          cat > capacitor.config.json <<'CFG'
          {
            "appId": "com.fanchan.sentinel",
            "appName": "Fanchan Sentinel",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          CFG
          npm install -g @capacitor/cli@latest
          npx cap add android
          # 把 www 同步进 android 资产目录
          npx cap sync android
          # 调低 minSdk 以兼容更多老机型
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle || true
          sed -i 's/minSdkVersion 22/minSdkVersion 23/' android/app/build.gradle || true
          # 🔴 关键：客户端要连 http://<隧道域名>（明文 HTTP）→
          #    必须开 cleartext，否则 Android 9+ 直接拒连。
          if ! grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
              android/app/src/main/AndroidManifest.xml
          fi
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml
          ls -la android/app/build/outputs 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchan-sentinel-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
