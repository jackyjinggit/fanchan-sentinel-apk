name: build-apk

# 🔴 2026-10-28 11:00 重写：
#   前 6 版用 Capacitor，全部卡在 "Could not find the android platform"
#   （Capacitor 7+ 的 platform 检测逻辑与 runner 的 SDK 布局不兼容，
#     android-34/35/36/37 全部装好仍报找不到 → 已放弃）。
#   改用 **Cordova**：检测逻辑简单（只看 platforms/ 目录 + Android SDK），
#   且 www 直接进 assets/，不需要额外 sync 步骤。
#
# 触发：push 到 main（tag 时额外发 Release）→ 产物 APK 可直接下载安装。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_SDK_ROOT/platforms"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cordova-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create Cordova project
        run: |
          npm install -g cordova
          cordova create app com.fanchan.sentinel FanchanSentinel
          cd app
          cordova platform add android@13 --nosave
          # 把 web 内容放进 www（cordova 的 webDir 默认就是 www）
          rm -rf www
          cp -r ../www ./www
          # 关键：客户端连的是明文 http 隧道域名 → 必须开 cleartext
          cordova plugin add cordova-plugin-allow-mixed-content --nosave || true
          sed -i 's|android:usesCleartextTraffic="true"|android:usesCleartextTraffic="true"|' \
            config.xml || true
          if ! grep -q 'usesCleartextTraffic="true"' config.xml; then
            sed -i 's|<widget|<widget android:usesCleartextTraffic="true"|' config.xml
          fi
          grep -n "usesCleartextTraffic" config.xml
          cordova build android --release -- --packageType=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchan-sentinel-apk
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/platforms/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
