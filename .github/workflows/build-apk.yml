name: build-apk

# 🔴 2026-10-28 11:00 重写：
#   前 6 版用 Capacitor，全部卡在 "Could not find the android platform"
#   （Capacitor 7+ 的 platform 检测逻辑与 runner 的 SDK 布局不兼容，
#     android-34/35/36/37 全部装好仍报找不到 → 已放弃）。
#   改用 **Cordova**：检测逻辑简单（只看 platforms/ 目录 + Android SDK），
#   且 www 直接进 assets/，不需要额外 sync 步骤。
#
# 触发：push 到 main（tag 时额外发 Release）→ 产物 APK 可直接下载安装。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_SDK_ROOT/platforms"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cordova-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create Cordova project
        run: |
          npm install -g cordova
          cordova create app com.fanchan.sentinel FanchanSentinel
          cd app
          cordova platform add android@13 --nosave
          # 把 web 内容放进 www（cordova 的 webDir 默认就是 www）
          rm -rf www
          cp -r ../www ./www
          # 🔴 关键：客户端要连公网 https 隧道域名 → 必须允许该来源。
          #   ❌ 不要用 sed 往 config.xml 的 <widget> 塞 android: 属性 ——
          #      那会生成 AttributePrefixUnbound 的坏 XML（第七版就是这么失败的）。
          #   ✅ 用 Cordova 原生的 <access> / <allow-navigation> 配置项
          #      （写在 <widget> 内部，走 Cordova 自己的 schema，合法）。
          python3 - <<'PYEOF'
          import io, re
          p = "config.xml"
          s = io.open(p, encoding="utf-8").read()
          if "<access origin=" not in s:
              s = s.replace("</widget>",
                  '    <access origin="*" />\n'
                  '    <allow-navigation href="*" />\n'
                  '    <preference name="AndroidInsecureFileModeEnabled" value="true" />\n'
                  '</widget>', 1)
              io.open(p, "w", encoding="utf-8").write(s)
          print("config patched, access count =", s.count("<access origin="))
          PYEOF
          grep -n "access origin\|allow-navigation" config.xml || true
          cordova build android --release -- --packageType=apk

      - name: Sign APK
        run: |
          # 🔴 cordova build --release 产出的是 **unsigned** APK，手机装不了
          #    （必须签名 + 走 zipalign）。云端已有 JDK17 + build-tools，直接签。
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -1)
          echo "build-tools: $BT"
          APK=$(ls app/platforms/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "apk: $APK"
          # 生成调试用 keystore（有效期 30 年）
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias fanchan \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass fanchan2026 -keypass fanchan2026 \
            -dname "CN=Fanchan Sentinel, OU=Personal, O=Fanchan, L=Chongqing, S=Chongqing, C=CN"
          # zipalign + apksigner
          "$BT/zipalign" -f -v 4 "$APK" app/platforms/android/app/build/outputs/apk/release/app-aligned.apk
          "$BT/apksigner" sign \
            --ks app/release.keystore --ks-pass pass:fanchan2026 \
            --key-pass pass:fanchan2026 --ks-key-alias fanchan \
            --out app/fanchan-sentinel.apk \
            app/platforms/android/app/build/outputs/apk/release/app-aligned.apk
          "$BT/apksigner" verify --print-certs app/fanchan-sentinel.apk | head -5
          ls -la app/fanchan-sentinel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchan-sentinel-apk
          path: app/fanchan-sentinel.apk
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🔴 softprops/action-gh-release 的 generate_release_notes 需要
          #    更高 token 权限（实测 "Resource not accessible by integration"）→ 改用 gh。
          #    release 已存在则只补传资产。
          gh release view v0.1.0 >/dev/null 2>&1 \
            || gh release create v0.1.0 --title "v0.1.0" \
                 --notes "Fanchan Sentinel Android client. Judgement runs on a local server (all inference stays on your machine)."
          gh release upload v0.1.0 app/fanchan-sentinel.apk --clobber \
            || echo "release asset upload skipped (no permission) - artifact still available"
