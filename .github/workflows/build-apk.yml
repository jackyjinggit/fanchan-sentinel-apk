name: build-apk

# 🔴 2026-10-28：本机无 Android SDK / JDK / gradle → 云端构建。
# 触发：push 到 main（tag 时额外发 Release）→ 产物 APK 可直接下载安装。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create Android project
        run: |
          # 🔴 用官方 capacitor-android 模板生成（比手写 gradle 稳）
          npm install -g @capacitor/cli@latest
          npx cap init FanchanSentinel com.fanchan.sentinel --web-dir www
          npx cap add android
          # 调低 minSdk 以兼容更多老机型
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle || true
          sed -i 's/minSdkVersion 22/minSdkVersion 23/' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchan-sentinel-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
